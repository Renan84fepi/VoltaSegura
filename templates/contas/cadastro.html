{% extends "base.html" %}
{% block titulo %}Criar conta — VoltaSegura{% endblock %}
{% block conteudo %}
<div class="vs-hero">
  <div class="vs-logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.6L13.5 2Z"/></svg>
  </div>
  <h1 class="h3 m-0">Criar conta</h1>
  <p>Leva menos de um minuto.</p>
</div>
<div class="card"><div class="card-body">
<form method="post" novalidate>
  {% csrf_token %}
  {% include "includes/campos.html" %}
  <button class="btn btn-primary btn-lg w-100" type="submit">Cadastrar</button>
</form>
</div></div>
<a class="d-block text-center mt-3" href="{% url 'login' %}">Já tenho conta</a>
{% endblock %}
