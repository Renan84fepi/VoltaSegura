{% extends "base.html" %}
{% block titulo %}Entrar — VoltaSegura{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">Entrar</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {% include "includes/campos.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
</form>
<div class="d-grid gap-2 mt-3">
  <a class="btn btn-outline-secondary" href="{% url 'password_reset' %}">Esqueci a senha</a>
  <a class="btn btn-outline-primary" href="{% url 'cadastro' %}">Criar conta</a>
</div>
{% endblock %}
