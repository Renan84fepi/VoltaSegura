{% extends "base.html" %}
{% block titulo %}Entrar — VoltaSegura{% endblock %}
{% block conteudo %}
<div class="vs-hero">
  <div class="vs-logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.6L13.5 2Z"/></svg>
  </div>
  <h1 class="h3 m-0">Entrar</h1>
  <p>Seu carro chega com você. O motorista volta de bike elétrica.</p>
</div>
<div class="card mb-3"><div class="card-body">
<form method="post" novalidate>
  {% csrf_token %}
  {% include "includes/campos.html" %}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
</form>
</div></div>
<div class="d-grid gap-2 mt-3">
  <a class="btn btn-outline-secondary" href="{% url 'password_reset' %}">Esqueci a senha</a>
  <a class="btn btn-outline-primary" href="{% url 'cadastro' %}">Criar conta</a>
</div>
{% endblock %}
