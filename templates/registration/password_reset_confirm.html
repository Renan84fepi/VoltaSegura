{% extends "base.html" %}
{% block conteudo %}
{% if validlink %}
  <h1 class="h3 mb-3">Nova senha</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "includes/campos.html" %}
    <button class="btn btn-primary btn-lg w-100" type="submit">Salvar nova senha</button>
  </form>
{% else %}
  <h1 class="h3 mb-3">Link inválido</h1>
  <p>Este link já foi usado ou expirou. Peça um novo.</p>
  <a class="btn btn-primary btn-lg w-100" href="{% url 'password_reset' %}">Pedir novo link</a>
{% endif %}
{% endblock %}
