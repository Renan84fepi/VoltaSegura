{% extends "base.html" %}
{% load static %}
{% block titulo %}Sua corrida — VoltaSegura{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">Sua corrida</h1>
<div id="acompanhamento"
     data-url-corrida="{% url 'api:corrida' corrida.pk %}"
     data-url-cancelar="{% url 'api:cancelar' corrida.pk %}"
     data-url-pagar="{% url 'api:pagar' corrida.pk %}"
     data-url-avaliar="{% url 'api:avaliar' corrida.pk %}"
     data-url-recibo="{% url 'corridas:recibo' corrida.pk %}"
     {% if simulador %}data-simulador="1"{% endif %}
     data-url-nova="{% url 'corridas:solicitar' %}">
  <div id="aviso-conexao" hidden></div>
  <div id="painel-corrida"><p class="text-muted">Carregando…</p></div>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'corridas/comum.js' %}?v={{ versao_estaticos }}"></script>
<script src="{% static 'corridas/cliente.js' %}?v={{ versao_estaticos }}"></script>
{% endblock %}
