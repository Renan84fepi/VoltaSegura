{% extends "base.html" %}
{% block conteudo %}
<h1 class="h3 mb-3">Remover veículo</h1>
<p>Deseja remover <strong>{{ object }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger btn-lg w-100" type="submit">Sim, remover</button>
  <a class="btn btn-outline-secondary w-100 mt-2" href="{% url 'veiculos:lista' %}">Cancelar</a>
</form>
{% endblock %}
