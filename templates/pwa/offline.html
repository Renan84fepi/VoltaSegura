{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6fb">
  <title>Sem conexão — VoltaSegura</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'pwa/tema.css' %}?v={{ versao_estaticos }}" rel="stylesheet">
  <style>
    /* Estilo mínimo próprio, caso o Bootstrap ou o tema não estejam no cache. */
    body { background: #f4f6fb; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; }
    .topo { display: flex; align-items: center; gap: .55rem; padding: .9rem 1rem; font-weight: 800; font-size: 1.1rem;
      background: rgba(255, 255, 255, .85); border-bottom: 1px solid rgba(15, 23, 42, .06); }
    .topo i { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-style: normal; color: #fff;
      background: linear-gradient(135deg, #4f46e5, #7c3aed 55%, #22d3ee 130%); }
    .caixa { max-width: 560px; margin: 0 auto; padding: 1.25rem 1rem; }
    .cartao { background: #fff; border: 1px solid rgba(15, 23, 42, .05); border-radius: 16px; padding: 1.15rem; margin-bottom: 1rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px -12px rgba(15, 23, 42, .12); }
    .codigo { font-size: 2.4rem; letter-spacing: .55rem; font-weight: 800; }
    .botao { display: block; width: 100%; padding: .95rem; font-size: 1.05rem; font-weight: 650; border-radius: 14px;
      border: 0; background: linear-gradient(135deg, #5b54f0, #4338ca); color: #fff; text-align: center; text-decoration: none;
      box-shadow: 0 8px 20px -10px rgba(79, 70, 229, .7); }
  </style>
</head>
<body>
<div class="topo"><i aria-hidden="true">⚡</i> VoltaSegura</div>
<main class="caixa">
  <h1 class="h4">Você está sem conexão</h1>
  <p>Assim que a internet voltar, a página é recarregada sozinha.</p>

  <div id="corrida" class="cartao" hidden>
    <div class="small text-muted">Última situação da sua corrida <span id="salvo-em"></span></div>
    <div class="fs-5 fw-bold" id="status"></div>
    <div class="small"><strong>Coleta:</strong> <span id="origem"></span></div>
    <div class="small"><strong>Destino:</strong> <span id="destino"></span></div>
    <div id="bloco-codigo" class="text-center mt-2" hidden>
      <div class="small text-muted">Código para o motorista</div>
      <div class="codigo" id="codigo"></div>
    </div>
    <div id="bloco-contato" class="mt-2" hidden>
      <span id="contato-nome"></span> — <a id="contato-tel" href="#"></a>
      <div class="small text-muted">A ligação funciona mesmo sem internet.</div>
    </div>
  </div>

  <button class="botao" type="button" id="tentar">Tentar novamente</button>
</main>
<script src="{% static 'pwa/offline.js' %}?v={{ versao_estaticos }}"></script>
</body>
</html>
