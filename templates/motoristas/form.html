{% extends "base.html" %}
{% block conteudo %}
<h1 class="h4 mb-3">{{ titulo }}</h1>
<form method="post" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  {% include "includes/campos.html" %}
  {% if object.pk %}
    <p class="small text-muted">Ao alterar dados já enviados, a aprovação volta para "pendente".</p>
  {% endif %}
  <button class="btn btn-primary btn-lg w-100" type="submit">Salvar</button>
  <a class="btn btn-outline-secondary w-100 mt-2" href="{% url 'motoristas:painel' %}">Voltar</a>
</form>
{% endblock %}
